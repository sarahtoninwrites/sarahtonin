    .flipper {
      position: relative;
      width: 300px;
      height: auto;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .flipper.flip {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height:auto;
      backface-visibility: hidden;
    }

    .back {
      transform: rotateY(180deg);

  <script>
    function draftEmail() {
        // Replace placeholders with actual email content
        const to = 'suslifeapp@gmail.com';
        const subject = 'SusLife Waitlist';
        const body = 'hi sarah \n im [NAME] and im interested in trying out SusLife when it comes out! hmu \n ttyl';

        // Construct mailto URI
        const mailtoURI = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        // Open default email client with the drafted email
        window.location.href = mailtoURI;
    }
</script>
